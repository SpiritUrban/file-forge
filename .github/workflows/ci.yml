name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  rust:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Rule 2: Rust job must build frontend before cargo commands
      - name: Build Desktop Frontend
        run: |
          npm ci
          npm run build

      - name: Check Rust Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy Lints
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml \
            --message-format=short -- -D warnings 2>&1 | tee clippy.log

      - name: Surface Clippy diagnostics
        if: failure()
        shell: bash
        run: |
          if [ ! -s clippy.log ]; then
            echo "::error title=Clippy::clippy.log is missing or empty"
            exit 0
          fi
          log=$(tail -c 6000 clippy.log)
          log="${log//'%'/'%25'}"
          log="${log//$'\r'/'%0D'}"
          log="${log//$'\n'/'%0A'}"
          echo "::error title=Clippy output::$log"

      - name: Run Rust Unit Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee test.log

      - name: Surface Test output
        if: failure()
        shell: bash
        run: |
          if [ ! -s test.log ]; then
            echo "::error title=Test::test.log is missing or empty"
            exit 0
          fi
          log=$(tail -c 6000 test.log)
          log="${log//'%'/'%25'}"
          log="${log//$'\r'/'%0D'}"
          log="${log//$'\n'/'%0A'}"
          echo "::error title=Test output::$log"
