name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/generate-download-manifest.mjs'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Generate Download Manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-download-manifest.mjs

      - name: Report resolved release
        run: |
          v=$(node -p "require('./site/public/download-manifest.json').version")
          n=$(node -p "require('./site/public/download-manifest.json').assets.length")
          echo "::notice title=Download manifest::ref=${GITHUB_REF_NAME} -> version ${v}, ${n} assets"

      - name: Build Marketing Site
        env:
          GITHUB_PAGES: 'true'
        run: npm run build:site

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site/dist'
      - id: deployment
        uses: actions/deploy-pages@v4
